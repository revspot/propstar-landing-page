# Runs the content validator and prerender on every PR and push to main.
#
# Amplify already fails the deploy when content is broken, so this is not the
# only gate — but a failing build on main means the site silently stays on the
# previous deploy, and nobody looks at Amplify until someone reports a stale
# page. Catching it on the PR is cheaper.
#
# No install step: scripts/build-content.js and scripts/prerender.js are ES5
# CommonJS with zero npm dependencies.
name: content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Validates every project's city/locality/budget/purpose reference and
      # that each image exists on disk, then prerenders all 45 pages.
      # Exits non-zero on any dangling reference or missing shell marker.
      # No SITE_ORIGIN: absent means production, which is what this branch is.
      # The beta branch overrides it and asserts the inverse of the checks below.
      - name: Build content and prerender
        run: node scripts/build-content.js

      # The generated files are committed, so a CMS edit that was not followed
      # by a build would otherwise drift from its source.
      - name: Generated files must be up to date
        run: |
          git diff --exit-code -- content/catalogue.json cms/config.yml \
            || { echo "::error::content/catalogue.json or cms/config.yml is stale. Run 'node scripts/build-content.js' and commit the result."; exit 1; }

      - name: Matching engine self-check
        run: node scripts/check-matching.js

      # The whole point of the SEO work: every page must ship real content.
      # A silent prerender regression would otherwise pass unnoticed.
      - name: Pages must contain real content
        run: |
          set -e
          for f in dist/index.html dist/properties/index.html dist/about/index.html; do
            grep -q '<h1' "$f" || { echo "::error::$f has no <h1>"; exit 1; }
          done
          words=$(sed 's/<[^>]*>/ /g' dist/project/godrej-arden/index.html | wc -w)
          [ "$words" -gt 200 ] || { echo "::error::project page has only $words words"; exit 1; }
          test -f dist/sitemap.xml && test -f dist/robots.txt
          # production must be indexable, carry the GA4 tag, and canonicalise to
          # the real origin. These are the exact inverse of the beta branch's
          # assertions — if a merge ever swaps them, CI says so.
          grep -q 'index,follow' dist/index.html || { echo "::error::production build is not indexable"; exit 1; }
          ! grep -q 'noindex' dist/index.html || { echo "::error::production build carries noindex"; exit 1; }
          grep -q 'Allow: /' dist/robots.txt || { echo "::error::production robots.txt does not allow crawling"; exit 1; }
          grep -q 'Sitemap:' dist/robots.txt || { echo "::error::production robots.txt has no sitemap"; exit 1; }
          grep -q 'G-DNDDSBZ5VS' dist/index.html || { echo "::error::GA4 tag missing from production build"; exit 1; }
          grep -q 'https://propstarsolution.com/' dist/sitemap.xml || { echo "::error::sitemap does not point at the production origin"; exit 1; }
          # Check the tags that carry an origin, not any mention of the string —
          # the source comments legitimately name the beta host when explaining
          # that CORS is per-origin, and a blunt grep flags those.
          ! grep -rqE '(rel="canonical" href|property="og:url" content|content)="https://beta\.' dist --include='*.html' \
            || { echo "::error::beta origin in a production canonical/og tag"; exit 1; }
          ! grep -q 'beta\.propstarsolution\.com' dist/sitemap.xml || { echo "::error::beta origin in the production sitemap"; exit 1; }
          # admin.html must never be publishable
          ! test -e dist/admin.html || { echo "::error::admin.html leaked into dist/"; exit 1; }
          echo "dist OK: $(find dist -type f | wc -l) files"
